<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sa3aty | متجر ساعاتي الفاخر</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brandDark: '#050505',
                        brandCharcoal: '#0d0d0e',
                        brandPanel: '#121214',
                        brandGold: {
                            300: '#fde047',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                            accent: '#fbbf24'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at top, #18181b 0%, #0d0d0e 50%, #050505 100%);
            min-height: 100vh;
            color: #f1f5f9;
        }

        .glass-panel {
            background: rgba(18, 18, 20, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(250, 204, 21, 0.2);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
        }

        .glass-nav {
            background: rgba(5, 5, 5, 0.90);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(250, 204, 21, 0.25);
        }

        .gold-glow {
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.25);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ca8a04;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-brandGold-400 selection:text-black">

    <!-- Header / Navbar -->
    <header class="glass-nav sticky top-0 z-40 px-4 lg:px-8 py-3 transition-all">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Left Controls: Tabs & Lang -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="hidden md:flex items-center bg-brandDark p-1 border border-amber-500/20">
                    <button onclick="filterCategory('all')" id="tab-all" class="px-4 py-1.5 text-xs font-bold transition-all text-amber-300 bg-amber-500/20 border border-amber-500/40">
                        <i class="fa-solid fa-border-all ml-1"></i> <span id="txt-tab-all">الكل</span>
                    </button>
                    <button onclick="filterCategory('offers')" id="tab-offers" class="px-4 py-1.5 text-xs font-bold transition-all text-slate-400 hover:text-amber-300">
                        <i class="fa-solid fa-fire text-amber-400 ml-1"></i> <span id="txt-tab-offers">العروض</span>
                    </button>
                </div>

                <button onclick="toggleLanguage()" class="px-2.5 py-1.5 bg-brandDark border border-amber-500/30 text-amber-400 hover:bg-amber-500/10 text-xs font-black transition-all flex items-center gap-1">
                    <i class="fa-solid fa-globe"></i>
                    <span id="langSwitchText">EN</span>
                </button>
            </div>

            <!-- Center Logo Image -->
            <a href="#" onclick="filterCategory('all')" class="flex items-center gap-2 group">
                <i class="fa-solid fa-clock text-amber-400 text-2xl group-hover:rotate-12 transition-transform"></i>
                <span class="text-xl font-black tracking-wider text-amber-400">SA3ATY</span>
            </a>

            <!-- Right Controls: Add Watch, Cart & Admin -->
            <div class="flex items-center space-x-3 space-x-reverse">
                <button id="ownerAddBtn" onclick="openAddWatchModal()" class="hidden bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black px-3 py-1.5 text-xs shadow-lg gold-glow transition-all active:scale-95 flex items-center gap-1">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span id="txt-add-btn" class="hidden sm:inline">إضافة ساعة</span>
                </button>

                <button onclick="openCartModal()" class="relative p-2 bg-brandDark border border-amber-500/30 text-amber-400 hover:bg-amber-500/10 transition-all">
                    <i class="fa-solid fa-bag-shopping text-base"></i>
                    <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-amber-400 text-slate-950 text-[10px] font-black w-4 h-4 flex items-center justify-center border border-brandDark shadow">
                        0
                    </span>
                </button>

                <button id="adminToggleBtn" onclick="handleAdminToggle()" class="p-2 bg-brandDark border border-slate-700 text-slate-400 hover:text-amber-400 hover:border-amber-500/40 transition-all" title="وضع الأدمن">
                    <i id="adminLockIcon" class="fa-solid fa-lock text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Body -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        
        <div id="adminBanner" class="hidden mb-6 p-4 bg-amber-500/10 border border-amber-500/40 flex flex-wrap justify-between items-center text-amber-200 gap-2">
            <div class="flex items-center space-x-3 space-x-reverse text-sm">
                <i class="fa-solid fa-crown text-amber-400 text-lg"></i>
                <span id="txt-admin-banner">أهلاً بك يا <strong>صاحب المتجر!</strong> (وضع الأدمن مفعّل).</span>
            </div>
            <button onclick="logoutAdmin()" id="txt-admin-logout" class="text-xs text-rose-400 hover:text-rose-300 underline font-bold">
                خروج من وضع الأدمن
            </button>
        </div>

        <div class="glass-panel p-4 mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-amber-500/60 text-sm"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ابحث باسم الساعة..."
                    class="w-full bg-brandDark border border-amber-500/20 pr-10 pl-4 py-2.5 text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400 transition-colors">
            </div>

            <div class="flex items-center justify-between md:justify-end w-full md:w-auto gap-4">
                <span id="productCount" class="text-xs text-amber-400/90 font-semibold">جاري تحميل البيانات...</span>
                <select id="sortSelect" onchange="handleSortChange()" class="bg-brandDark border border-amber-500/20 text-slate-200 text-xs sm:text-sm px-3 py-2.5 focus:outline-none focus:border-amber-400 cursor-pointer">
                    <option value="newest" id="opt-newest">الأحدث إضافة</option>
                    <option value="price-low" id="opt-price-low">السعر: من الأقل للأعلى</option>
                    <option value="price-high" id="opt-price-high">السعر: من الأعلى للأقل</option>
                </select>
            </div>
        </div>

        <!-- Watches Product Grid -->
        <div id="watchesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden flex-col items-center justify-center text-center py-20 px-4 glass-panel my-6 border border-dashed border-amber-500/30">
            <h3 id="txt-empty-title" class="text-xl font-bold text-slate-200 mb-2">المتجر فاضي حالياً!</h3>
        </div>
    </main>

    <!-- Watch Details & Comments Modal -->
    <div id="watchDetailModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="glass-panel max-w-3xl w-full p-6 sm:p-8 border border-amber-500/40 relative my-8">
            <button onclick="closeWatchDetailModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Image Slider -->
                <div>
                    <div class="w-full h-64 sm:h-80 bg-brandDark border border-amber-500/20 overflow-hidden mb-3">
                        <img id="detailMainImg" src="" class="w-full h-full object-contain">
                    </div>
                    <div id="detailThumbnails" class="flex gap-2 overflow-x-auto pb-2"></div>
                </div>

                <!-- Info & Comments -->
                <div class="flex flex-col justify-between">
                    <div>
                        <h2 id="detailTitle" class="text-xl font-bold text-slate-100 mb-2"></h2>
                        <div class="flex items-center gap-3 mb-3">
                            <span id="detailPrice" class="text-xl font-black text-amber-300 font-mono"></span>
                            <span id="detailOldPrice" class="text-xs text-slate-500 line-through font-mono"></span>
                        </div>
                        <p id="detailDesc" class="text-xs text-slate-300 leading-relaxed mb-4 bg-brandDark/50 p-3 border border-amber-500/10"></p>
                        
                        <button id="detailAddToCartBtn" class="w-full bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black py-2.5 text-xs sm:text-sm mb-6 shadow-lg gold-glow flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cart-plus"></i> إضافة للسلة
                        </button>
                    </div>

                    <!-- Comments Section -->
                    <div class="border-t border-amber-500/20 pt-4">
                        <h4 class="text-xs font-bold text-amber-400 mb-2 flex items-center gap-1.5">
                            <i class="fa-solid fa-comments"></i> التعليقات والآراء (<span id="commentsCount">0</span>)
                        </h4>
                        
                        <div id="commentsList" class="space-y-2 max-h-36 overflow-y-auto pr-1 mb-3 text-xs"></div>

                        <form onsubmit="handleAddComment(event)" class="flex gap-2">
                            <input type="text" id="commentAuthorInput" placeholder="اسمك" required class="w-1/3 bg-brandDark border border-amber-500/20 px-2 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                            <input type="text" id="commentTextInput" placeholder="اكتب تعليقك هنا..." required class="w-2/3 bg-brandDark border border-amber-500/20 px-2 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                            <button type="submit" class="bg-amber-500 text-slate-950 font-bold px-3 py-1.5 text-xs hover:bg-amber-400">إرسال</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Password Modal -->
    <div id="passwordModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full p-6 sm:p-8 border border-amber-500/40 relative">
            <button onclick="closePasswordModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <form onsubmit="verifyAdminPin(event)" class="space-y-4">
                <input type="password" id="adminPinInput" placeholder="أدخل الرمز السري..." required class="w-full bg-brandDark border border-amber-500/30 px-4 py-3 text-center tracking-widest text-xl text-amber-300 focus:outline-none focus:border-amber-400">
                <p id="pinErrorMsg" class="text-xs text-rose-400 hidden text-center">الرمز السري خاطئ!</p>
                <button type="submit" class="w-full bg-gradient-to-r from-amber-400 to-amber-500 font-extrabold py-3 text-sm text-slate-950">دخول كصاحب المتجر</button>
            </form>
        </div>
    </div>

    <!-- Add Watch Modal -->
    <div id="addWatchModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4 overflow-y-auto">
        <div class="glass-panel max-w-lg w-full p-6 sm:p-8 border border-amber-500/40 relative my-8">
            <button onclick="closeAddWatchModal()" class="absolute top-5 left-5 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>

            <h3 class="text-xl font-bold text-slate-100 mb-4" id="watchModalTitle">إضافة / تعديل ساعة</h3>

            <form onsubmit="handleSaveWatchSubmit(event)" class="space-y-4">
                <input type="hidden" id="editingWatchId" value="">

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">اسم الساعة والموديل</label>
                    <input type="text" id="watchTitleInput" required class="w-full bg-brandDark border border-amber-500/30 px-4 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">صور الساعة (يمكنك اختيار أكثر من صورة)</label>
                    <input type="file" id="watchFileInput" accept="image/*" multiple onchange="previewSelectedImages(event)" class="block w-full text-xs text-slate-300 file:py-1.5 file:px-3 file:bg-amber-500/20 file:text-amber-300 cursor-pointer bg-brandDark border border-amber-500/30 mb-2">
                    <div id="imagesPreviewContainer" class="flex gap-2 overflow-x-auto py-2"></div>
                    <textarea id="watchImageUrlsInput" rows="2" placeholder="أو أدخل روابط الصور مفصولة بفواصل (URL1, URL2...)" class="w-full bg-brandDark border border-amber-500/30 px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-400"></textarea>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">السعر (ج.م)</label>
                        <input type="number" id="watchPriceInput" required class="w-full bg-brandDark border border-amber-500/30 px-3 py-2 text-xs text-slate-100 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">السعر القديم (اختياري)</label>
                        <input type="number" id="watchOldPriceInput" class="w-full bg-brandDark border border-amber-500/30 px-3 py-2 text-xs text-slate-100 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">تصنيف المنتَج</label>
                    <select id="watchTagInput" class="w-full bg-brandDark border border-amber-500/30 px-3 py-2 text-xs text-slate-100">
                        <option value="regular">منتج عادي</option>
                        <option value="offer">عرض خاص (Offers 🔥)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">وصف مختصر</label>
                    <textarea id="watchDescInput" rows="2" class="w-full bg-brandDark border border-amber-500/30 px-3 py-1.5 text-xs text-slate-100 focus:outline-none"></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeAddWatchModal()" class="px-4 py-2 text-xs text-slate-400">إلغاء</button>
                    <button type="submit" class="bg-amber-400 text-slate-950 font-black px-6 py-2 text-xs">حفظ الساعة</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Customer Modal -->
    <div id="customerModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full p-6 border border-amber-500/40 relative">
            <button onclick="closeCustomerModal()" class="absolute top-4 left-4 text-slate-400"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-lg font-bold text-slate-100 mb-4 text-center">تأكيد الطلب</h3>
            <form onsubmit="submitCustomerOrder(event)" class="space-y-4">
                <input type="text" id="customerNameInput" placeholder="الاسم بالكامل" required class="w-full bg-brandDark border border-amber-500/30 p-2.5 text-xs text-slate-100">
                <input type="tel" id="customerPhoneInput" placeholder="رقم الهاتف (واتساب)" required class="w-full bg-brandDark border border-amber-500/30 p-2.5 text-xs text-slate-100">
                <button type="submit" class="w-full bg-emerald-600 text-white font-bold p-3 text-xs flex items-center justify-center gap-2"><i class="fa-brands fa-whatsapp"></i> إرسال عبر الواتساب</button>
            </form>
        </div>
    </div>

    <!-- Cart Panel -->
    <div id="cartModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex justify-end">
        <div class="glass-panel max-w-md w-full h-full p-6 border-r border-amber-500/30 flex flex-col justify-between">
            <div>
                <div class="flex items-center justify-between border-b border-amber-500/20 pb-4 mb-4">
                    <h3 class="text-lg font-bold text-slate-100">سلة المشتريات</h3>
                    <button onclick="closeCartModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div id="cartItemsContainer" class="space-y-3 max-h-[60vh] overflow-y-auto"></div>
            </div>
            <div class="border-t border-amber-500/20 pt-4">
                <div class="flex justify-between mb-4 font-bold text-amber-300">
                    <span>المبلغ الإجمالي:</span>
                    <span id="cartTotalPrice">0 ج.م</span>
                </div>
                <button onclick="openCustomerModal()" id="checkoutBtn" disabled class="w-full bg-amber-400 disabled:opacity-50 text-slate-950 font-black py-3 text-xs">إتمام الطلب عبر الواتساب</button>
            </div>
        </div>
    </div>

    <!-- Firebase App Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUDZ32oBwhBX8BtLrjIAHuq_3rKMfbMvI",
            authDomain: "sa3aty-30312.firebaseapp.com",
            databaseURL: "https://sa3aty-30312-default-rtdb.firebaseio.com",
            projectId: "sa3aty-30312",
            storageBucket: "sa3aty-30312.firebasestorage.app",
            messagingSenderId: "613567954494",
            appId: "1:613567954494:web:6f9b2ec5db04db1f459b6f",
            measurementId: "G-ZX3WF0RX25"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const watchesRef = ref(db, 'watches');

        window.db = db;
        window.watches = [];
        window.STORE_PHONE = "201144387828";
        window.currentLang = 'ar';
        window.isAdmin = false;
        window.ADMIN_PIN = "96278306";
        window.activeCategory = 'all';
        window.searchQuery = '';
        window.sortBy = 'newest';
        window.uploadedImagesBase64 = [];
        window.currentWatchDetailId = null;

        try { window.cart = JSON.parse(localStorage.getItem('sa3aty_cart')) || []; } catch(e) { window.cart = []; }

        onValue(watchesRef, (snapshot) => {
            const data = snapshot.val();
            window.watches = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderStore();
            if (window.currentWatchDetailId) {
                openWatchDetailModal(window.currentWatchDetailId);
            }
        });

        window.saveWatchToFirebase = function(watchData, editId = null) {
            if (editId) {
                set(ref(db, `watches/${editId}`), watchData);
            } else {
                set(push(watchesRef), watchData);
            }
        };

        window.deleteWatchFromFirebase = function(id) {
            remove(ref(db, `watches/${id}`));
        };

        window.addCommentToFirebase = function(watchId, commentData) {
            const commentRef = push(ref(db, `watches/${watchId}/comments`));
            set(commentRef, commentData);
        };
    </script>

    <!-- App Main Logic -->
    <script>
        window.addEventListener('DOMContentLoaded', () => { updateCartUI(); });

        function toggleLanguage() {
            window.currentLang = window.currentLang === 'ar' ? 'en' : 'ar';
            document.getElementById('langSwitchText').textContent = window.currentLang === 'ar' ? 'EN' : 'AR';
            document.documentElement.dir = window.currentLang === 'ar' ? 'rtl' : 'ltr';
            document.documentElement.lang = window.currentLang;
        }

        function previewSelectedImages(event) {
            const files = Array.from(event.target.files);
            uploadedImagesBase64 = [];
            const container = document.getElementById('imagesPreviewContainer');
            container.innerHTML = '';

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height, max_size = 400;
                        if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
                        else { if (height > max_size) { width *= max_size / height; height = max_size; } }
                        canvas.width = width; canvas.height = height;
                        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                        const base64 = canvas.toDataURL('image/jpeg', 0.5);
                        uploadedImagesBase64.push(base64);

                        const thumb = document.createElement('img');
                        thumb.src = base64;
                        thumb.className = "w-12 h-12 object-cover border border-amber-500/30";
                        container.appendChild(thumb);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        function handleAdminToggle() {
            if (isAdmin) { logoutAdmin(); }
            else { document.getElementById('passwordModal').classList.remove('hidden'); }
        }
        function closePasswordModal() { document.getElementById('passwordModal').classList.add('hidden'); }
        function verifyAdminPin(e) {
            e.preventDefault();
            if (document.getElementById('adminPinInput').value === ADMIN_PIN) {
                isAdmin = true;
                closePasswordModal();
                updateAdminUIState();
            } else { document.getElementById('pinErrorMsg').classList.remove('hidden'); }
        }
        function logoutAdmin() { isAdmin = false; updateAdminUIState(); }
        function updateAdminUIState() {
            document.getElementById('ownerAddBtn').classList.toggle('hidden', !isAdmin);
            document.getElementById('adminBanner').classList.toggle('hidden', !isAdmin);
            renderStore();
        }

        function openAddWatchModal(editId = null) {
            document.getElementById('addWatchModal').classList.remove('hidden');
            uploadedImagesBase64 = [];
            document.getElementById('imagesPreviewContainer').innerHTML = '';

            if (editId) {
                const w = watches.find(item => item.id === editId);
                if (w) {
                    document.getElementById('editingWatchId').value = w.id;
                    document.getElementById('watchTitleInput').value = w.title;
                    document.getElementById('watchPriceInput').value = w.price;
                    document.getElementById('watchOldPriceInput').value = w.oldPrice || '';
                    document.getElementById('watchTagInput').value = w.tag || 'regular';
                    document.getElementById('watchDescInput').value = w.desc || '';
                    const imgs = Array.isArray(w.images) ? w.images : [w.image];
                    document.getElementById('watchImageUrlsInput').value = imgs.join(', ');
                }
            } else {
                document.getElementById('editingWatchId').value = '';
                document.getElementById('watchTitleInput').value = '';
                document.getElementById('watchPriceInput').value = '';
                document.getElementById('watchOldPriceInput').value = '';
                document.getElementById('watchDescInput').value = '';
                document.getElementById('watchImageUrlsInput').value = '';
            }
        }
        function closeAddWatchModal() { document.getElementById('addWatchModal').classList.add('hidden'); }

        function handleSaveWatchSubmit(e) {
            e.preventDefault();
            const editId = document.getElementById('editingWatchId').value;
            const title = document.getElementById('watchTitleInput').value.trim();
            const manualUrls = document.getElementById('watchImageUrlsInput').value.split(',').map(s => s.trim()).filter(Boolean);
            
            let imagesList = uploadedImagesBase64.length > 0 ? uploadedImagesBase64 : manualUrls;
            if (imagesList.length === 0) {
                imagesList = ['https://images.unsplash.com/photo-1524805444758-089113d48a6d?q=80&w=600&auto=format&fit=crop'];
            }

            const watchPayload = {
                title,
                image: imagesList[0],
                images: imagesList,
                price: parseFloat(document.getElementById('watchPriceInput').value),
                oldPrice: parseFloat(document.getElementById('watchOldPriceInput').value) || 0,
                tag: document.getElementById('watchTagInput').value,
                desc: document.getElementById('watchDescInput').value.trim(),
                createdAt: editId ? (watches.find(w => w.id === editId)?.createdAt || Date.now()) : Date.now()
            };

            if (window.saveWatchToFirebase) { window.saveWatchToFirebase(watchPayload, editId || null); }
            closeAddWatchModal();
        }

        function deleteWatch(id) {
            if (isAdmin && confirm("هل أنت متأكد من حذف هذه الساعة؟")) {
                if (window.deleteWatchFromFirebase) { window.deleteWatchFromFirebase(id); }
            }
        }

        function openWatchDetailModal(id) {
            const w = watches.find(item => item.id === id);
            if (!w) return;

            window.currentWatchDetailId = id;
            document.getElementById('detailTitle').textContent = w.title;
            document.getElementById('detailPrice').textContent = `${Number(w.price).toLocaleString()} ج.م`;
            document.getElementById('detailOldPrice').textContent = w.oldPrice ? `${Number(w.oldPrice).toLocaleString()} ج.م` : '';
            document.getElementById('detailDesc').textContent = w.desc || 'لا يوجد وصف إضافي.';

            const images = Array.isArray(w.images) && w.images.length > 0 ? w.images : [w.image];
            const mainImg = document.getElementById('detailMainImg');
            mainImg.src = images[0];

            const thumbsContainer = document.getElementById('detailThumbnails');
            thumbsContainer.innerHTML = images.map(img => `
                <img src="${img}" onclick="document.getElementById('detailMainImg').src='${img}'" class="w-12 h-12 object-cover border border-amber-500/30 cursor-pointer hover:border-amber-400">
            `).join('');

            document.getElementById('detailAddToCartBtn').onclick = () => addToCart(w.id);

            // Comments
            const commentsList = document.getElementById('commentsList');
            const comments = w.comments ? Object.values(w.comments) : [];
            document.getElementById('commentsCount').textContent = comments.length;

            commentsList.innerHTML = comments.length === 0 ? '<p class="text-slate-500 text-[11px]">لا يوجد تعليقات بعد.</p>' :
                comments.map(c => `
                    <div class="bg-brandDark/80 p-2 border border-amber-500/10">
                        <span class="font-bold text-amber-400">${escapeHtml(c.author)}:</span>
                        <span class="text-slate-200">${escapeHtml(c.text)}</span>
                    </div>
                `).join('');

            document.getElementById('watchDetailModal').classList.remove('hidden');
        }

        function closeWatchDetailModal() {
            window.currentWatchDetailId = null;
            document.getElementById('watchDetailModal').classList.add('hidden');
        }

        function handleAddComment(e) {
            e.preventDefault();
            if (!window.currentWatchDetailId) return;

            const author = document.getElementById('commentAuthorInput').value.trim();
            const text = document.getElementById('commentTextInput').value.trim();

            if (author && text && window.addCommentToFirebase) {
                window.addCommentToFirebase(window.currentWatchDetailId, { author, text, timestamp: Date.now() });
                document.getElementById('commentTextInput').value = '';
            }
        }

        function filterCategory(cat) { activeCategory = cat; renderStore(); }
        function handleSearch() { searchQuery = document.getElementById('searchInput').value.trim().toLowerCase(); renderStore(); }
        function handleSortChange() { sortBy = document.getElementById('sortSelect').value; renderStore(); }

        function renderStore() {
            const grid = document.getElementById('watchesGrid');
            const emptyState = document.getElementById('emptyState');
            let filtered = (window.watches || []).filter(w => activeCategory === 'offers' ? (w.tag === 'offer' || w.oldPrice > w.price) : true);

            if (searchQuery) { filtered = filtered.filter(w => w.title.toLowerCase().includes(searchQuery)); }
            filtered.sort((a, b) => sortBy === 'price-low' ? a.price - b.price : sortBy === 'price-high' ? b.price - a.price : (b.createdAt || 0) - (a.createdAt || 0));

            document.getElementById('productCount').textContent = `${filtered.length} ساعة معروضة`;

            if (filtered.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            } else {
                emptyState.classList.add('hidden');
                emptyState.classList.remove('flex');
            }

            grid.innerHTML = filtered.map(watch => `
                <div class="glass-panel p-4 flex flex-col justify-between hover:border-amber-500/50 transition-all duration-300 group relative">
                    <div onclick="openWatchDetailModal('${watch.id}')" class="relative w-full h-52 overflow-hidden mb-4 bg-brandDark border border-amber-500/10 cursor-pointer">
                        <img src="${escapeHtml(watch.image)}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        ${isAdmin ? `
                            <div class="absolute top-2 left-2 flex gap-1 z-10" onclick="event.stopPropagation()">
                                <button onclick="openAddWatchModal('${watch.id}')" class="w-7 h-7 bg-brandDark text-amber-300 border border-amber-500/30 flex items-center justify-center text-xs"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteWatch('${watch.id}')" class="w-7 h-7 bg-brandDark text-rose-300 border border-rose-500/30 flex items-center justify-center text-xs"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        ` : ''}
                    </div>

                    <div onclick="openWatchDetailModal('${watch.id}')" class="cursor-pointer">
                        <h4 class="text-base font-bold text-slate-100 group-hover:text-amber-300 line-clamp-1 mb-1">${escapeHtml(watch.title)}</h4>
                        <p class="text-xs text-slate-400 line-clamp-2 mb-4 leading-relaxed min-h-[32px]">${escapeHtml(watch.desc || '')}</p>
                    </div>

                    <div class="pt-3 border-t border-amber-500/10 flex items-center justify-between">
                        <div class="text-base font-black text-amber-300 font-mono">${Number(watch.price).toLocaleString()} <span class="text-xs text-slate-300">ج.م</span></div>
                        <button onclick="addToCart('${watch.id}')" class="bg-amber-500/20 text-amber-300 hover:bg-amber-500/30 border border-amber-500/40 p-2 text-xs font-bold flex items-center gap-1.5 transition-all"><i class="fa-solid fa-cart-plus"></i> إضافة للسلة</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const watch = watches.find(w => w.id === id);
            if (!watch) return;
            const existing = cart.find(i => i.id === id);
            if (existing) { existing.qty += 1; }
            else { cart.push({ id: watch.id, title: watch.title, price: watch.price, image: watch.image, qty: 1 }); }
            try { localStorage.setItem('sa3aty_cart', JSON.stringify(cart)); } catch(e){}
            updateCartUI();
            openCartModal();
        }

        function updateCartUI() {
            document.getElementById('cartBadge').textContent = cart.reduce((s, i) => s + i.qty, 0);
            document.getElementById('cartTotalPrice').textContent = `${cart.reduce((s, i) => s + (i.price * i.qty), 0).toLocaleString()} ج.م`;
            document.getElementById('checkoutBtn').disabled = cart.length === 0;

            document.getElementById('cartItemsContainer').innerHTML = cart.map(i => `
                <div class="bg-brandDark p-2.5 border border-amber-500/20 flex items-center justify-between text-xs">
                    <img src="${escapeHtml(i.image)}" class="w-10 h-10 object-cover border border-amber-500/20">
                    <div class="flex-1 px-2">
                        <h5 class="font-bold text-slate-100 line-clamp-1">${escapeHtml(i.title)}</h5>
                        <div class="text-amber-400 font-mono">${Number(i.price).toLocaleString()} ج.م</div>
                    </div>
                    <div class="flex items-center gap-2 bg-brandPanel border border-amber-500/20 px-2 py-1">
                        <button onclick="updateCartQty('${i.id}', -1)" class="text-slate-400 hover:text-amber-400 font-bold px-1">-</button>
                        <span class="text-slate-100 font-bold">${i.qty}</span>
                        <button onclick="updateCartQty('${i.id}', 1)" class="text-slate-400 hover:text-amber-400 font-bold px-1">+</button>
                    </div>
                </div>
            `).join('');
        }

        function updateCartQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            try { localStorage.setItem('sa3aty_cart', JSON.stringify(cart)); } catch(e){}
            updateCartUI();
        }

        function openCartModal() { document.getElementById('cartModal').classList.remove('hidden'); }
        function closeCartModal() { document.getElementById('cartModal').classList.add('hidden'); }
        function openCustomerModal() { closeCartModal(); document.getElementById('customerModal').classList.remove('hidden'); }
        function closeCustomerModal() { document.getElementById('customerModal').classList.add('hidden'); }

        function submitCustomerOrder(e) {
            e.preventDefault();
            const name = document.getElementById('customerNameInput').value.trim();
            const phone = document.getElementById('customerPhoneInput').value.trim();
            let message = `طلب جديد من: ${name} (${phone})\n\nالطلبات:\n`;
            cart.forEach((i, idx) => { message += `${idx + 1}. ${i.title} (${i.qty}) - ${i.price * i.qty} ج.م\n`; });
            message += `\nالإجمالي: ${cart.reduce((s, i) => s + (i.price * i.qty), 0)} ج.م`;
            window.open(`https://wa.me/${STORE_PHONE}?text=${encodeURIComponent(message)}`, '_blank');
            closeCustomerModal();
        }

        function escapeHtml(str) { return String(str || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
    </script>
</body>
</html>
