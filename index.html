<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sa3aty | متجر ساعاتي الفاخر</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif'],
                    },
                    colors: {
                        brandDark: '#050505',
                        brandCharcoal: '#0d0d0e',
                        brandPanel: '#121214',
                        brandGold: {
                            300: '#fde047',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                            accent: '#fbbf24'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #050505;
            background-image: 
                radial-gradient(rgba(250, 204, 21, 0.12) 1px, transparent 1.5px),
                radial-gradient(rgba(234, 179, 8, 0.08) 1px, transparent 1.5px),
                radial-gradient(circle at top, #18181b 0%, #0d0d0e 50%, #050505 100%);
            background-size: 80px 80px, 120px 120px, 100% 100%;
            background-position: 0 0, 40px 40px, 0 0;
            background-attachment: fixed;
            min-height: 100vh;
            color: #f1f5f9;
        }

        .glass-panel {
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(250, 204, 21, 0.2);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
        }

        .glass-nav {
            background: rgba(5, 5, 5, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(250, 204, 21, 0.25);
        }

        .gold-glow {
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.25);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #050505;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ca8a04;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen selection:bg-brandGold-400 selection:text-black">

    <!-- Header / Navbar -->
    <header class="glass-nav sticky top-0 z-40 px-4 lg:px-8 py-3 transition-all">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            
            <!-- Left Controls: Tabs & Custom Order Button -->
            <div class="flex items-center space-x-2 sm:space-x-3 space-x-reverse">
                <div class="hidden md:flex items-center bg-brandDark p-1 border border-amber-500/20">
                    <button onclick="filterCategory('all')" id="tab-all" class="px-4 py-1.5 text-xs font-bold transition-all text-amber-300 bg-amber-500/20 border border-amber-500/40">
                        <i class="fa-solid fa-border-all ml-1"></i> <span>الكل</span>
                    </button>
                    <button onclick="filterCategory('offers')" id="tab-offers" class="px-4 py-1.5 text-xs font-bold transition-all text-slate-400 hover:text-amber-300">
                        <i class="fa-solid fa-fire text-amber-400 ml-1"></i> <span>العروض</span>
                    </button>
                </div>

                <!-- Custom Request Button for Users -->
                <button onclick="openCustomRequestModal()" class="bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/40 text-amber-400 font-bold px-3 py-1.5 text-xs transition-all flex items-center gap-1.5">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                    <span>طلب ساعة عمولة</span>
                </button>
            </div>

            <!-- Center Logo Image -->
            <a href="#" onclick="filterCategory('all')" class="flex flex-col items-center group">
                <svg class="h-10 sm:h-12 w-auto group-hover:scale-105 transition-transform duration-300" viewBox="0 0 520 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#FDE047" />
                            <stop offset="50%" stop-color="#EAB308" />
                            <stop offset="100%" stop-color="#CA8A04" />
                        </linearGradient>
                    </defs>
                    <text x="10" y="90" font-family="'Cairo', sans-serif" font-weight="900" font-size="95" fill="url(#goldGrad)">S</text>
                    <g transform="translate(115, 20)">
                        <circle cx="38" cy="45" r="36" stroke="url(#goldGrad)" stroke-width="7" fill="#0d0d0e"/>
                        <circle cx="38" cy="45" r="30" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 4" fill="none"/>
                        <line x1="38" y1="45" x2="38" y2="24" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round"/>
                        <line x1="38" y1="45" x2="52" y2="45" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="38" cy="45" r="3.5" fill="url(#goldGrad)"/>
                        <rect x="74" y="40" width="4" height="10" rx="1" fill="url(#goldGrad)"/>
                    </g>
                    <text x="215" y="95" font-family="'Cairo', sans-serif" font-weight="900" font-size="110" fill="url(#goldGrad)">3</text>
                    <text x="325" y="90" font-family="'Cairo', sans-serif" font-weight="800" font-size="80" fill="url(#goldGrad)">aty</text>
                </svg>
            </a>

            <!-- Right Controls: Add Watch, Cart & Admin -->
            <div class="flex items-center space-x-2 sm:space-x-3 space-x-reverse">
                <button id="ownerAddBtn" onclick="openAddWatchModal()" class="hidden bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-300 hover:to-amber-400 text-slate-950 font-black px-3 py-1.5 text-xs shadow-lg gold-glow transition-all active:scale-95 flex items-center gap-1">
                    <i class="fa-solid fa-plus text-sm"></i>
                    <span class="hidden sm:inline">إضافة ساعة</span>
                </button>

                <button onclick="openCartModal()" class="relative p-2 bg-brandDark border border-amber-500/30 text-amber-400 hover:bg-amber-500/10 transition-all">
                    <i class="fa-solid fa-bag-shopping text-base"></i>
                    <span id="cartBadge" class="absolute -top-1.5 -right-1.5 bg-amber-400 text-slate-950 text-[10px] font-black w-4 h-4 flex items-center justify-center border border-brandDark shadow">0</span>
                </button>

                <button id="adminToggleBtn" onclick="handleAdminToggle()" class="p-2 bg-brandDark border border-slate-700 text-slate-400 hover:text-amber-400 hover:border-amber-500/40 transition-all" title="وضع الأدمن">
                    <i id="adminLockIcon" class="fa-solid fa-lock text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Body -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
        
        <!-- Admin Mode Banner -->
        <div id="adminBanner" class="hidden mb-6 p-4 bg-amber-500/10 border border-amber-500/40 flex flex-wrap justify-between items-center text-amber-200 gap-2">
            <div class="flex items-center space-x-3 space-x-reverse text-sm">
                <i class="fa-solid fa-crown text-amber-400 text-lg"></i>
                <span>أهلاً بك يا <strong>صاحب المتجر!</strong> (وضع الأدمن مفعّل).</span>
            </div>
            <button onclick="logoutAdmin()" class="text-xs text-rose-400 hover:text-rose-300 underline font-bold">خروج من وضع الأدمن</button>
        </div>

        <!-- Filter & Search Controls -->
        <div class="glass-panel p-4 mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-amber-500/60 text-sm"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="ابحث باسم الساعة..." class="w-full bg-brandDark border border-amber-500/20 pr-10 pl-4 py-2.5 text-xs sm:text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-amber-400 transition-colors">
            </div>

            <div class="flex items-center justify-between md:justify-end w-full md:w-auto gap-4">
                <span id="productCount" class="text-xs text-amber-400/90 font-semibold">جاري تحميل البيانات...</span>
                <select id="sortSelect" onchange="handleSortChange()" class="bg-brandDark border border-amber-500/20 text-slate-200 text-xs sm:text-sm px-3 py-2.5 focus:outline-none focus:border-amber-400 cursor-pointer">
                    <option value="newest">الأحدث إضافة</option>
                    <option value="price-low">السعر: من الأقل للأعلى</option>
                    <option value="price-high">السعر: من الأعلى للأقل</option>
                </select>
            </div>
        </div>

        <!-- Watches Product Grid -->
        <div id="watchesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
    </main>

    <!-- Custom Watch Request Modal -->
    <div id="customRequestModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full p-6 sm:p-8 border border-amber-500/40 relative">
            <button onclick="closeCustomRequestModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <h3 class="text-lg font-bold text-amber-300 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-wand-magic-sparkles"></i> طلب ساعة بمواصفات خاصة
            </h3>
            
            <form onsubmit="sendCustomRequestToWhatsApp(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">الاسم بالكامل</label>
                    <input type="text" id="reqName" required placeholder="اسمك..." class="w-full bg-brandDark border border-amber-500/30 px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">وصف الشكل / الموديل المطلوبة</label>
                    <textarea id="reqDesc" rows="3" required placeholder="اكتب المواصفات، الماركة، أو لون الساعة..." class="w-full bg-brandDark border border-amber-500/30 px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">رابط صورة الساعة (اختياري)</label>
                    <input type="url" id="reqImgUrl" placeholder="https://..." class="w-full bg-brandDark border border-amber-500/30 px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 text-xs flex items-center justify-center gap-2 transition-all">
                    <i class="fa-brands fa-whatsapp text-sm"></i> إرسال الطلب مباشر للواتساب
                </button>
            </form>
        </div>
    </div>

    <!-- Modal Add / Edit Watch -->
    <div id="watchModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-lg w-full p-6 sm:p-8 border border-amber-500/40 relative max-h-[90vh] overflow-y-auto">
            <button onclick="closeWatchModal()" class="absolute top-4 left-4 text-slate-400 hover:text-white">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            
            <h3 id="modalTitle" class="text-lg font-bold text-amber-300 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-plus-circle"></i> إضافة ساعة جديدة
            </h3>
            
            <form onsubmit="handleWatchSubmit(event)" class="space-y-4">
                <input type="hidden" id="watchId">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">اسم الساعة</label>
                    <input type="text" id="watchTitle" required class="w-full bg-brandDark border border-amber-500/30 px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">السعر (ج.م)</label>
                        <input type="number" id="watchPrice" required class="w-full bg-brandDark border border-amber-500/30 px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1">السعر القديم (اختياري)</label>
                        <input type="number" id="watchOldPrice" class="w-full bg-brandDark border border-amber-500/30 px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">رابط الصورة (Image URL)</label>
                    <input type="url" id="watchImage" required placeholder="https://..." class="w-full bg-brandDark border border-amber-500/30 px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">الوصف</label>
                    <textarea id="watchDesc" rows="3" class="w-full bg-brandDark border border-amber-500/30 px-3 py-2 text-xs text-slate-100 focus:outline-none focus:border-amber-400"></textarea>
                </div>
                <div class="flex items-center gap-2">
                    <input type="checkbox" id="watchIsOffer" class="accent-amber-400">
                    <label for="watchIsOffer" class="text-xs text-slate-300">إضافة العرض لقسم العروض الخاصة</label>
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-2.5 text-xs transition-all">
                    حفظ البيانات
                </button>
            </form>
        </div>
    </div>

    <!-- Modal Cart -->
    <div id="cartModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="glass-panel max-w-md w-full p-6 border border-amber-500/40 relative max-h-[90vh] flex flex-col">
            <div class="flex justify-between items-center pb-3 border-b border-amber-500/20 mb-4">
                <h3 class="text-base font-bold text-amber-300 flex items-center gap-2">
                    <i class="fa-solid fa-bag-shopping"></i> سلة المشتريات
                </h3>
                <button onclick="closeCartModal()" class="text-slate-400 hover:text-white">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            
            <div id="cartItemsList" class="flex-1 overflow-y-auto space-y-3 mb-4 pr-1"></div>

            <div class="border-t border-amber-500/20 pt-3 space-y-3">
                <div class="flex justify-between items-center font-bold text-sm">
                    <span class="text-slate-300">الإجمالي:</span>
                    <span id="cartTotal" class="text-amber-400">0 ج.م</span>
                </div>
                <button onclick="sendCartToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 text-xs flex items-center justify-center gap-2 transition-all">
                    <i class="fa-brands fa-whatsapp text-sm"></i> تأكيد الطلب عبر الواتساب
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase App Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, push, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBUDZ32oBwhBX8BtLrjIAHuq_3rKMfbMvI",
            authDomain: "sa3aty-30312.firebaseapp.com",
            databaseURL: "https://sa3aty-30312-default-rtdb.firebaseio.com",
            projectId: "sa3aty-30312",
            storageBucket: "sa3aty-30312.firebasestorage.app",
            messagingSenderId: "613567954494",
            appId: "1:613567954494:web:6f9b2ec5db04db1f459b6f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const watchesRef = ref(db, 'watches');

        window.db = db;
        window.watchesRef = watchesRef;
        window.push = push;
        window.set = set;
        window.remove = remove;
        window.ref = ref;

        window.watches = [];
        window.cart = [];
        window.currentCategory = 'all';
        window.searchQuery = '';
        window.sortBy = 'newest';
        window.STORE_PHONE = "201144387828";
        window.isAdmin = false;
        window.ADMIN_PIN = "96278306";

        onValue(watchesRef, (snapshot) => {
            const data = snapshot.val();
            window.watches = data ? Object.keys(data).map(key => ({ id: key, ...data[key] })) : [];
            renderStore();
        });
    </script>

    <!-- Custom Logic Script -->
    <script>
        function openCustomRequestModal() { document.getElementById('customRequestModal').classList.remove('hidden'); }
        function closeCustomRequestModal() { document.getElementById('customRequestModal').classList.add('hidden'); }

        function sendCustomRequestToWhatsApp(e) {
            e.preventDefault();
            const name = document.getElementById('reqName').value.trim();
            const desc = document.getElementById('reqDesc').value.trim();
            const imgUrl = document.getElementById('reqImgUrl').value.trim();

            let message = `*طلب ساعة خاصة (عمولة)* ⌚✨\n\n`;
            message += `*الاسم:* ${name}\n`;
            message += `*تفاصيل الطلب:* ${desc}\n`;
            if (imgUrl) message += `*رابط الصورة:* ${imgUrl}\n`;

            window.open(`https://wa.me/${window.STORE_PHONE}?text=${encodeURIComponent(message)}`, '_blank');
            closeCustomRequestModal();
        }

        function handleAdminToggle() {
            if (window.isAdmin) {
                logoutAdmin();
            } else {
                const pin = prompt("أدخل الرقم السري للوحة الأدمن:");
                if (pin === window.ADMIN_PIN) {
                    window.isAdmin = true;
                    document.getElementById('ownerAddBtn').classList.remove('hidden');
                    document.getElementById('adminBanner').classList.remove('hidden');
                    document.getElementById('adminLockIcon').className = "fa-solid fa-lock-open text-amber-400";
                    renderStore();
                } else if (pin) {
                    alert("الرقم السري غير صحيح!");
                }
            }
        }

        function logoutAdmin() {
            window.isAdmin = false;
            document.getElementById('ownerAddBtn').classList.add('hidden');
            document.getElementById('adminBanner').classList.add('hidden');
            document.getElementById('adminLockIcon').className = "fa-solid fa-lock text-sm";
            renderStore();
        }

        function openAddWatchModal() {
            document.getElementById('watchId').value = '';
            document.getElementById('watchTitle').value = '';
            document.getElementById('watchPrice').value = '';
            document.getElementById('watchOldPrice').value = '';
            document.getElementById('watchImage').value = '';
            document.getElementById('watchDesc').value = '';
            document.getElementById('watchIsOffer').checked = false;
            document.getElementById('modalTitle').innerText = 'إضافة ساعة جديدة';
            document.getElementById('watchModal').classList.remove('hidden');
        }

        function closeWatchModal() { document.getElementById('watchModal').classList.add('hidden'); }

        function editWatch(id) {
            const w = window.watches.find(item => item.id === id);
            if (!w) return;
            document.getElementById('watchId').value = w.id;
            document.getElementById('watchTitle').value = w.title || '';
            document.getElementById('watchPrice').value = w.price || '';
            document.getElementById('watchOldPrice').value = w.oldPrice || '';
            document.getElementById('watchImage').value = w.image || '';
            document.getElementById('watchDesc').value = w.desc || '';
            document.getElementById('watchIsOffer').checked = !!w.isOffer;
            document.getElementById('modalTitle').innerText = 'تعديل بيانات الساعة';
            document.getElementById('watchModal').classList.remove('hidden');
        }

        function deleteWatch(id) {
            if (confirm("هل أنت تأكد من حذف هذه الساعة؟")) {
                window.remove(window.ref(window.db, 'watches/' + id));
            }
        }

        function handleWatchSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('watchId').value;
            const data = {
                title: document.getElementById('watchTitle').value,
                price: Number(document.getElementById('watchPrice').value),
                oldPrice: document.getElementById('watchOldPrice').value ? Number(document.getElementById('watchOldPrice').value) : null,
                image: document.getElementById('watchImage').value,
                desc: document.getElementById('watchDesc').value,
                isOffer: document.getElementById('watchIsOffer').checked,
                createdAt: Date.now()
            };

            if (id) {
                window.set(window.ref(window.db, 'watches/' + id), data);
            } else {
                window.push(window.watchesRef, data);
            }
            closeWatchModal();
        }

        function filterCategory(cat) {
            window.currentCategory = cat;
            document.getElementById('tab-all').className = cat === 'all' 
                ? 'px-4 py-1.5 text-xs font-bold transition-all text-amber-300 bg-amber-500/20 border border-amber-500/40' 
                : 'px-4 py-1.5 text-xs font-bold transition-all text-slate-400 hover:text-amber-300';
            document.getElementById('tab-offers').className = cat === 'offers' 
                ? 'px-4 py-1.5 text-xs font-bold transition-all text-amber-300 bg-amber-500/20 border border-amber-500/40' 
                : 'px-4 py-1.5 text-xs font-bold transition-all text-slate-400 hover:text-amber-300';
            renderStore();
        }

        function handleSearch() {
            window.searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            renderStore();
        }

        function handleSortChange() {
            window.sortBy = document.getElementById('sortSelect').value;
            renderStore();
        }

        function addToCart(id) {
            const w = window.watches.find(item => item.id === id);
            if (!w) return;
            const existing = window.cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                window.cart.push({ ...w, qty: 1 });
            }
            updateCartBadge();
        }

        function updateCartBadge() {
            const totalQty = window.cart.reduce((acc, item) => acc + item.qty, 0);
            document.getElementById('cartBadge').innerText = totalQty;
        }

        function openCartModal() {
            renderCartItems();
            document.getElementById('cartModal').classList.remove('hidden');
        }

        function closeCartModal() { document.getElementById('cartModal').classList.add('hidden'); }

        function changeQty(id, delta) {
            const item = window.cart.find(i => i.id === id);
            if (!item) return;
            item.qty += delta;
            if (item.qty <= 0) {
                window.cart = window.cart.filter(i => i.id !== id);
            }
            updateCartBadge();
            renderCartItems();
        }

        function renderCartItems() {
            const list = document.getElementById('cartItemsList');
            if (window.cart.length === 0) {
                list.innerHTML = `<div class="text-center py-8 text-slate-500 text-xs">السلة فارغة حالياً</div>`;
                document.getElementById('cartTotal').innerText = '0 ج.م';
                return;
            }

            let total = 0;
            list.innerHTML = window.cart.map(item => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                return `
                    <div class="flex items-center justify-between p-2 bg-brandDark border border-amber-500/20 text-xs">
                        <div class="flex items-center gap-2">
                            <img src="${item.image}" class="w-10 h-10 object-cover">
                            <div>
                                <div class="font-bold text-slate-200">${item.title}</div>
                                <div class="text-amber-400 font-bold">${item.price} ج.م</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQty('${item.id}', -1)" class="w-5 h-5 bg-zinc-800 text-amber-400 font-bold flex items-center justify-center">-</button>
                            <span class="text-slate-200 font-bold">${item.qty}</span>
                            <button onclick="changeQty('${item.id}', 1)" class="w-5 h-5 bg-zinc-800 text-amber-400 font-bold flex items-center justify-center">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cartTotal').innerText = total + ' ج.م';
        }

        function sendCartToWhatsApp() {
            if (window.cart.length === 0) return alert("السلة فارغة!");
            let msg = `*طلب جديد من متجر ساعاتي* ⌚✨\n\n`;
            let total = 0;
            window.cart.forEach((item, index) => {
                const itemTotal = item.price * item.qty;
                total += itemTotal;
                msg += `${index + 1}. *${item.title}* - العدد: ${item.qty} - السعر: ${itemTotal} ج.م\n`;
            });
            msg += `\n*الإجمالي:* ${total} ج.م`;
            window.open(`https://wa.me/${window.STORE_PHONE}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function renderStore() {
            const grid = document.getElementById('watchesGrid');
            let items = [...(window.watches || [])];

            if (window.currentCategory === 'offers') {
                items = items.filter(w => w.isOffer);
            }

            if (window.searchQuery) {
                items = items.filter(w => w.title.toLowerCase().includes(window.searchQuery));
            }

            if (window.sortBy === 'price-low') {
                items.sort((a, b) => a.price - b.price);
            } else if (window.sortBy === 'price-high') {
                items.sort((a, b) => b.price - a.price);
            } else {
                items.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
            }

            document.getElementById('productCount').textContent = `${items.length} ساعة معروضة`;

            if (items.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500 text-sm">لا توجد ساعات مطابقة للبحث حالياً.</div>`;
                return;
            }

            grid.innerHTML = items.map(w => `
                <div class="glass-panel p-4 flex flex-col justify-between relative group">
                    ${w.isOffer ? '<span class="absolute top-2 right-2 bg-amber-500 text-black font-black text-[10px] px-2 py-0.5 z-10">عرض خاص</span>' : ''}
                    <div>
                        <div class="overflow-hidden mb-3 h-48 bg-black flex items-center justify-center">
                            <img src="${w.image}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                        </div>
                        <h4 class="font-bold text-sm text-slate-100 mb-1 line-clamp-1">${w.title}</h4>
                        <p class="text-xs text-slate-400 line-clamp-2 mb-3">${w.desc || 'ساعة أنيقة وعصرية'}</p>
                    </div>

                    <div>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-amber-400 font-extrabold text-base">${w.price} ج.م</span>
                            ${w.oldPrice ? `<span class="text-xs text-slate-500 line-through">${w.oldPrice} ج.م</span>` : ''}
                        </div>

                        <div class="flex items-center gap-2">
                            <button onclick="addToCart('${w.id}')" class="flex-1 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/40 text-amber-300 font-bold py-2 text-xs transition-all flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-cart-plus"></i> إضـافة للسـلة
                            </button>
                            ${window.isAdmin ? `
                                <button onclick="editWatch('${w.id}')" class="p-2 bg-blue-600/20 text-blue-400 border border-blue-500/30 text-xs"><i class="fa-solid fa-pen"></i></button>
                                <button onclick="deleteWatch('${w.id}')" class="p-2 bg-rose-600/20 text-rose-400 border border-rose-500/30 text-xs"><i class="fa-solid fa-trash"></i></button>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
